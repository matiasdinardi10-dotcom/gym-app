<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Mi Entrenamiento</title>
<style>
  :root {
    --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --green: #1D9E75;
    --green-light: #E1F5EE;
    --green-dark: #0F6E56;
    --red: #D93025;
    --red-light: #FDECEA;
    --orange: #E67E22;
    --bg: #f2f2f7;
    --text: #111;
    --text2: #666;
    --border: #e8e8e8;
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  body { font-family: var(--font-sans); background: var(--bg); min-height: 100vh; }
  button, input, textarea, select { font-family: var(--font-sans); }

  #login-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
  .login-logo { width: 72px; height: 72px; background: var(--green); border-radius: 20px; display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem; }
  .login-logo svg { width: 38px; height: 38px; color: white; }
  .login-title { font-size: 24px; font-weight: 600; color: var(--text); margin-bottom: 0.4rem; }
  .login-sub { font-size: 14px; color: var(--text2); margin-bottom: 2rem; }
  .login-card { background: white; border-radius: var(--radius); padding: 1.5rem; width: 100%; max-width: 360px; box-shadow: 0 2px 16px rgba(0,0,0,0.08); }
  .login-field { margin-bottom: 1rem; }
  .login-field label { display: block; font-size: 12px; font-weight: 500; color: var(--text2); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.05em; }
  .login-field input { width: 100%; padding: 0.75rem 1rem; border-radius: 10px; border: 1px solid var(--border); font-size: 16px; background: #f9f9f9; color: var(--text); }
  .login-field input:focus { outline: none; border-color: var(--green); background: white; }
  .btn-login { width: 100%; padding: 0.9rem; border-radius: 12px; border: none; background: var(--green); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 0.5rem; }
  .login-error { font-size: 13px; color: var(--red); text-align: center; margin-top: 0.75rem; display: none; }

  #app { display: none; max-width: 430px; margin: 0 auto; min-height: 100vh; }
  .app-header { background: white; padding: 1rem 1.25rem 0.75rem; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .header-top { display: flex; align-items: center; justify-content: space-between; }
  .header-greeting { font-size: 18px; font-weight: 600; color: var(--text); }
  .header-date { font-size: 13px; color: var(--text2); margin-top: 2px; }
  .btn-logout { font-size: 12px; color: var(--text2); background: none; border: none; cursor: pointer; padding: 4px 8px; border-radius: 8px; }

  .day-strip { display: flex; gap: 6px; overflow-x: auto; padding: 0.75rem 1.25rem; scrollbar-width: none; background: white; border-bottom: 0.5px solid var(--border); }
  .day-strip::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; width: 44px; text-align: center; border-radius: 10px; padding: 6px 0; cursor: pointer; border: 1px solid var(--border); background: white; }
  .day-btn .dn { font-size: 10px; color: var(--text2); }
  .day-btn .dd { font-size: 15px; font-weight: 500; color: var(--text); }
  .day-btn.today { border-color: var(--green); }
  .day-btn.today .dd { color: var(--green); }
  .day-btn.has-ex { background: var(--green-light); border-color: #5DCAA5; }
  .day-btn.has-ex .dd { color: var(--green-dark); }
  .day-btn.is-done { background: var(--green); border-color: var(--green); }
  .day-btn.is-done .dd, .day-btn.is-done .dn { color: white; }
  .day-btn.selected { outline: 2px solid var(--green); outline-offset: 2px; }

  #view-home { padding: 1rem 1.25rem; }
  .ex-preview { background: white; border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 0.6rem; border: 1px solid var(--border); display: flex; align-items: center; gap: 12px; transition: border-color 0.2s; cursor: pointer; }
  .ex-preview.done { border-color: #5DCAA5; background: #f0faf6; }
  .ex-preview.missed { border-color: #f5a0a0; background: #fff8f8; }
  .ex-letter { width: 32px; height: 32px; border-radius: 8px; background: var(--green-light); color: var(--green-dark); font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ex-preview-info { flex: 1; min-width: 0; }
  .ex-preview-name { font-size: 14px; font-weight: 500; color: var(--text); }
  .ex-preview-tags { font-size: 12px; color: var(--text2); margin-top: 2px; }
  .ex-status-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .dot-done { background: var(--green); }
  .dot-missed { background: var(--red); }
  .dot-pending { background: #ccc; }
  .empty-day { text-align: center; padding: 3rem 1rem; color: var(--text2); font-size: 14px; }

  /* ── BOTÓN WORKOUT ── */
  .workout-btn {
    width: 100%; padding: 1rem 1.25rem;
    border-radius: 14px; border: none;
    font-size: 16px; font-weight: 700;
    cursor: pointer; margin-bottom: 1rem;
    display: flex; align-items: center; justify-content: center; gap: 10px;
    letter-spacing: 0.02em;
    transition: opacity 0.15s;
  }
  .workout-btn:active { opacity: 0.85; }
  .workout-btn.start  { background: var(--green); color: white; }
  .workout-btn.continue { background: var(--orange); color: white; }
  .workout-btn.view   { background: #e8e8e8; color: var(--text2); }

  /* ── VISTA DÍA COMPLETADO ── */
  .completed-day-pill { background: var(--green); border-radius: var(--radius); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; cursor: pointer; margin-bottom: 0.75rem; user-select: none; }
  .completed-day-pill-left { display: flex; align-items: center; gap: 12px; }
  .completed-day-icon { width: 36px; height: 36px; background: rgba(255,255,255,0.2); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 18px; }
  .completed-day-title { font-size: 16px; font-weight: 600; color: white; }
  .completed-day-sub { font-size: 12px; color: rgba(255,255,255,0.75); margin-top: 2px; }
  .completed-day-arrow { font-size: 18px; color: rgba(255,255,255,0.7); transition: transform 0.2s; }
  .completed-day-arrow.open { transform: rotate(180deg); }
  .completed-day-content { display: none; }
  .completed-day-content.open { display: block; }

  .done-ex-card { background: white; border-radius: var(--radius); margin-bottom: 0.6rem; border: 1px solid var(--border); overflow: hidden; }
  .done-ex-card.is-done { border-color: #5DCAA5; }
  .done-ex-card.is-missed { border-color: #f5a0a0; }
  .done-ex-header { display: flex; align-items: center; gap: 12px; padding: 1rem 1.25rem 0.75rem; }
  .done-ex-letter { width: 36px; height: 36px; border-radius: 10px; background: var(--green-light); color: var(--green-dark); font-weight: 700; font-size: 15px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .done-ex-letter.missed { background: var(--red-light); color: var(--red); }
  .done-ex-name { font-size: 15px; font-weight: 600; color: var(--text); flex: 1; }
  .done-ex-badge { font-size: 11px; padding: 3px 10px; border-radius: 20px; white-space: nowrap; }
  .done-ex-badge.done { background: var(--green-light); color: var(--green-dark); }
  .done-ex-badge.missed { background: var(--red-light); color: var(--red); }
  .done-ex-prescribed { padding: 0 1.25rem 0.75rem; display: flex; flex-wrap: wrap; gap: 6px; }
  .prescribed-tag { font-size: 12px; padding: 4px 10px; border-radius: 20px; background: #f0f0f5; color: var(--text2); }
  .prescribed-note { width: 100%; font-size: 12px; color: var(--text2); padding: 6px 10px; background: #f9f9f9; border-radius: 8px; border-left: 3px solid var(--green); margin-top: 2px; }
  .done-ex-logged { margin: 0 1rem 1rem; background: #f2f2f7; border-radius: 10px; padding: 0.75rem 1rem; }
  .done-ex-logged-title { font-size: 10px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 6px; }
  .done-ex-series-row { font-size: 13px; color: var(--text); padding: 3px 0; border-bottom: 0.5px solid var(--border); }
  .done-ex-series-row:last-of-type { border-bottom: none; }
  .done-ex-comment { font-size: 12px; color: var(--text2); font-style: italic; margin-top: 6px; padding-top: 6px; border-top: 0.5px solid var(--border); }
  .done-yt-link { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: #C0392B; text-decoration: none; background: #FEF2F2; padding: 3px 8px; border-radius: 20px; margin: 0 1.25rem 0.75rem; }

  /* ── SESSION ── */
  #view-session { display: none; }
  .session-header { background: white; padding: 1rem 1.25rem; border-bottom: 0.5px solid var(--border); position: sticky; top: 0; z-index: 10; }
  .session-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; }
  .btn-exit { font-size: 14px; color: var(--text2); background: none; border: none; cursor: pointer; }
  .session-title { font-size: 14px; font-weight: 500; color: var(--text); }
  .progress-dots { display: flex; gap: 5px; justify-content: center; flex-wrap: wrap; }
  .prog-dot { width: 8px; height: 8px; border-radius: 50%; background: #ddd; transition: background 0.2s; }
  .prog-dot.current { background: var(--green); transform: scale(1.3); }
  .prog-dot.done { background: var(--green); }
  .prog-dot.missed { background: var(--orange); }

  .session-body { padding: 1rem 1.25rem; }
  .ex-card { background: white; border-radius: var(--radius); padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,0.06); margin-bottom: 1rem; }
  .ex-card-header { display: flex; align-items: center; gap: 12px; margin-bottom: 1rem; }
  .ex-card-letter { width: 40px; height: 40px; border-radius: 10px; background: var(--green-light); color: var(--green-dark); font-weight: 700; font-size: 17px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ex-card-name { font-size: 18px; font-weight: 600; color: var(--text); }
  .ex-card-links { display: flex; gap: 8px; margin-top: 4px; flex-wrap: wrap; }
  .ex-card-link { font-size: 12px; color: var(--green); text-decoration: none; display: flex; align-items: center; gap: 3px; cursor: pointer; }
  .ex-card-link.yt { color: #C0392B; }
  .ex-card-note { background: #f9f9f9; border-radius: 10px; padding: 0.75rem 1rem; font-size: 13px; color: var(--text2); margin-bottom: 1rem; border-left: 3px solid var(--green); }

  /* Lo que el profe programó — dentro de la card activa */
  .ex-prescribed-block { background: var(--green-light); border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1rem; }
  .ex-prescribed-block-title { font-size: 10px; font-weight: 700; color: var(--green-dark); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .ex-prescribed-row { font-size: 13px; color: var(--green-dark); line-height: 1.7; }

  .series-list { margin-bottom: 1rem; }
  .series-row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 13px; }
  .series-row:last-child { border-bottom: none; }
  .series-num { width: 24px; height: 24px; border-radius: 6px; background: var(--green-light); color: var(--green-dark); font-weight: 700; font-size: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .series-inputs { display: flex; gap: 6px; flex: 1; }
  .series-input { flex: 1; padding: 5px 8px; border-radius: 8px; border: 1px solid var(--border); font-size: 13px; background: #f9f9f9; color: var(--text); min-width: 0; }
  .series-input:focus { outline: none; border-color: var(--green); }
  .series-input::placeholder { color: #bbb; }
  .series-input:disabled { background: #f0f0f0; color: var(--text2); }

  .attach-btn { display: flex; align-items: center; gap: 8px; background: #f9f9f9; border: 1.5px dashed var(--border); border-radius: 12px; padding: 0.75rem 1rem; cursor: pointer; margin-bottom: 1rem; font-size: 13px; color: var(--text2); width: 100%; }
  .attach-preview { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 1rem; }
  .attach-thumb { width: 64px; height: 64px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); }
  #file-input { display: none; }

  .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1rem; }
  .btn-missed { padding: 0.85rem; border-radius: 12px; border: 2px solid var(--red); background: white; color: var(--red); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-missed.active { background: var(--red); color: white; }
  .btn-completed { padding: 0.85rem; border-radius: 12px; border: 2px solid var(--green); background: white; color: var(--green-dark); font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .btn-completed.active { background: var(--green); color: white; }

  .comment-wrap { display: none; margin-bottom: 1rem; }
  .comment-wrap.open { display: block; }
  .comment-wrap textarea { width: 100%; padding: 0.75rem; border-radius: 12px; border: 1.5px solid var(--border); font-size: 14px; resize: none; min-height: 80px; color: var(--text); background: #f9f9f9; }
  .comment-wrap.green textarea { border-color: var(--green); background: var(--green-light); }
  .comment-wrap.red textarea { border-color: var(--red); background: var(--red-light); }
  .comment-wrap textarea:focus { outline: none; }

  .history-btn { width: 100%; padding: 0.7rem; border-radius: 12px; border: 1px solid var(--border); background: white; font-size: 13px; color: var(--text2); cursor: pointer; margin-bottom: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .history-content { display: none; background: #f9f9f9; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; }
  .history-content.open { display: block; }
  .history-entry { padding: 0.6rem 0; border-bottom: 0.5px solid var(--border); }
  .history-entry:last-child { border-bottom: none; }
  .history-date { font-size: 11px; color: var(--text2); font-weight: 600; }
  .history-load { font-size: 12px; color: var(--green-dark); margin-top: 2px; }
  .history-comment { font-size: 12px; color: var(--text2); margin-top: 2px; font-style: italic; }

  .session-nav-btns { display: flex; gap: 10px; }
  .btn-prev { flex: 1; padding: 0.85rem; border-radius: 12px; border: 1px solid var(--border); background: white; font-size: 14px; color: var(--text2); cursor: pointer; }
  .btn-next { flex: 2; padding: 0.85rem; border-radius: 12px; border: none; background: var(--green); color: white; font-size: 14px; font-weight: 600; cursor: pointer; }
  .btn-finish { flex: 2; padding: 0.85rem; border-radius: 12px; border: none; background: var(--orange); color: white; font-size: 14px; font-weight: 600; cursor: pointer; }

  #view-summary { display: none; padding: 1rem 1.25rem; }
  .summary-header { display: flex; align-items: center; gap: 10px; margin-bottom: 1.25rem; }
  .back-btn { background: none; border: none; font-size: 14px; color: var(--text2); cursor: pointer; padding: 0; }
  .summary-title { font-size: 18px; font-weight: 600; }
  .summary-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 1.25rem; }
  .stat-card { background: white; border-radius: var(--radius); padding: 1rem; text-align: center; }
  .stat-num { font-size: 32px; font-weight: 700; }
  .stat-num.green { color: var(--green); }
  .stat-num.red { color: var(--red); }
  .stat-label { font-size: 12px; color: var(--text2); margin-top: 4px; }
  .summary-item { background: white; border-radius: var(--radius); padding: 1rem 1.25rem; margin-bottom: 0.6rem; }
  .summary-item-name { font-size: 14px; font-weight: 600; color: var(--text); display: flex; align-items: center; gap: 8px; margin-bottom: 0.5rem; }
  .summary-status { font-size: 11px; padding: 2px 8px; border-radius: 20px; }
  .summary-status.done { background: var(--green-light); color: var(--green-dark); }
  .summary-status.missed { background: var(--red-light); color: var(--red); }
  .summary-comment { font-size: 13px; color: var(--text2); font-style: italic; }
  .btn-save-session { width: 100%; padding: 1rem; border-radius: 14px; border: none; background: var(--green); color: white; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 0.75rem; }
  .btn-save-session:disabled { background: #ccc; }

  .loading { text-align: center; padding: 3rem; color: var(--text2); font-size: 14px; }
  .toast { position: fixed; bottom: 1.5rem; left: 50%; transform: translateX(-50%); background: var(--green); color: white; padding: 0.6rem 1.2rem; border-radius: 10px; font-size: 13px; opacity: 0; transition: opacity 0.3s; pointer-events: none; z-index: 200; white-space: nowrap; }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--red); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-logo">
    <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
  </div>
  <div class="login-title">Mi Entrenamiento</div>
  <div class="login-sub" id="login-sub-text">Ingresá con tu cuenta</div>
  <div style="display:flex;gap:4px;background:#f0f0f0;border-radius:12px;padding:4px;width:100%;max-width:360px;margin-bottom:1.25rem">
    <button id="tab-login" onclick="switchAuthTab('login')" style="flex:1;padding:8px;border:none;border-radius:8px;background:white;font-size:14px;font-weight:500;cursor:pointer;font-family:var(--font-sans);color:#111">Ingresar</button>
    <button id="tab-register" onclick="switchAuthTab('register')" style="flex:1;padding:8px;border:none;border-radius:8px;background:transparent;font-size:14px;color:#888;cursor:pointer;font-family:var(--font-sans)">Registrarse</button>
  </div>
  <div class="login-card" id="form-login">
    <div class="login-field"><label>Email</label><input type="email" id="login-email" placeholder="tu@email.com" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <div class="login-field"><label>Contraseña</label><input type="password" id="login-password" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()" /></div>
    <button class="btn-login" onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
  </div>
  <div class="login-card" id="form-register" style="display:none">
    <div class="login-field"><label>Nombre completo</label><input type="text" id="reg-nombre" placeholder="Juan Pérez" /></div>
    <div class="login-field"><label>Email</label><input type="email" id="reg-email" placeholder="tu@email.com" /></div>
    <div class="login-field"><label>Contraseña</label><input type="password" id="reg-password" placeholder="Mínimo 6 caracteres" /></div>
    <div class="login-field"><label>Edad</label><input type="number" id="reg-edad" placeholder="25" /></div>
    <div class="login-field"><label>Objetivo</label><input type="text" id="reg-objetivo" placeholder="Ej: Bajar de peso" /></div>
    <button class="btn-login" onclick="doRegister()">Crear cuenta</button>
    <div class="login-error" id="reg-error"></div>
    <div id="reg-success" style="font-size:13px;color:var(--green);text-align:center;margin-top:0.75rem;display:none">✓ Cuenta creada. Ya podés ingresar.</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="app-header">
    <div class="header-top">
      <div>
        <div class="header-greeting" id="header-name">Hola 👋</div>
        <div class="header-date" id="header-date"></div>
      </div>
      <button class="btn-logout" onclick="doLogout()">Salir</button>
    </div>
  </div>
  <div class="day-strip" id="day-strip"></div>
  <div id="view-home">
    <div class="loading" id="home-loading">Cargando tu rutina…</div>
    <div id="home-content" style="display:none;padding:1rem 1.25rem"></div>
  </div>
  <div id="view-session">
    <div class="session-header">
      <div class="session-nav">
        <button class="btn-exit" onclick="exitSession()">← Salir</button>
        <span class="session-title" id="session-label">Sesión</span>
        <span style="font-size:13px;color:var(--text2)" id="session-counter"></span>
      </div>
      <div class="progress-dots" id="progress-dots"></div>
    </div>
    <div class="session-body" id="session-body"></div>
  </div>
  <div id="view-summary">
    <div class="summary-header">
      <button class="back-btn" onclick="showHome()">←</button>
      <div class="summary-title">Resumen de sesión</div>
    </div>
    <div id="summary-content"></div>
    <button class="btn-save-session" id="btn-save-session" onclick="saveFinalSession()">💾 Guardar sesión del día</button>
  </div>
</div>

<input type="file" id="file-input" accept="image/*,video/*" multiple onchange="handleFileUpload(event)" />
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://chbrespqluwlmzwhxjgi.supabase.co';
const SUPABASE_KEY = 'sb_publishable_-Jzgkul7Gt4p_dQEnrTXww_6n31yt_D';
const H = {'Content-Type':'application/json','apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY};

async function dbGet(t,p=''){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?${p}`,{headers:H});if(!r.ok)throw new Error(await r.text());return r.json();}
async function dbPost(t,b){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}`,{method:'POST',headers:{...H,'Prefer':'return=representation'},body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());return r.json();}
async function dbPatch(t,id,b){const r=await fetch(`${SUPABASE_URL}/rest/v1/${t}?id=eq.${id}`,{method:'PATCH',headers:H,body:JSON.stringify(b)});if(!r.ok)throw new Error(await r.text());}

const TODAY = new Date().toISOString().split('T')[0];
const DAYS = ['Do','Lu','Ma','Mi','Ju','Vi','Sa'];

let currentCliente = null;
let ejercicios = [], logs = [];
let selectedDate = TODAY;
let sessionExs = [];
let sessionIdx = 0;
let sessionState = {};
let currentExIdForFile = null;
let completedDayExpanded = false;
let sessionReadOnly = false; // true cuando es modo "Ver entrenamiento"

function isDayClosed(date) {
  const exs = ejercicios.filter(e => e.fecha_sesion === date);
  if (!exs.length) return false;
  return logs.some(l => l.fecha === date && exs.some(e => e.id === l.ejercicio_id));
}

// Determina cuántos ejercicios del día ya tienen algo marcado en sessionState
function countMarked(exs) {
  return exs.filter(e => sessionState[e.id]?.status !== null && sessionState[e.id]?.status !== undefined).length;
}

// ─── AUTH ──
function switchAuthTab(tab) {
  const isLogin = tab === 'login';
  document.getElementById('form-login').style.display = isLogin ? 'block' : 'none';
  document.getElementById('form-register').style.display = isLogin ? 'none' : 'block';
  document.getElementById('tab-login').style.cssText = `flex:1;padding:8px;border:none;border-radius:8px;background:${isLogin?'white':'transparent'};font-size:14px;font-weight:${isLogin?'500':'400'};cursor:pointer;font-family:var(--font-sans);color:${isLogin?'#111':'#888'}`;
  document.getElementById('tab-register').style.cssText = `flex:1;padding:8px;border:none;border-radius:8px;background:${isLogin?'transparent':'white'};font-size:14px;font-weight:${isLogin?'400':'500'};cursor:pointer;font-family:var(--font-sans);color:${isLogin?'#888':'#111'}`;
  document.getElementById('login-sub-text').textContent = isLogin ? 'Ingresá con tu cuenta' : 'Creá tu cuenta y empezá hoy';
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim().toLowerCase();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  if (!email || !password) { errEl.textContent = 'Completá email y contraseña'; errEl.style.display = 'block'; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (!r.ok || data.error) { errEl.textContent = 'Email o contraseña incorrectos'; errEl.style.display = 'block'; return; }
    const clientes = await dbGet('clientes', `email=eq.${encodeURIComponent(email)}&limit=1`);
    if (!clientes.length) { errEl.textContent = 'No encontramos tu cuenta. Contactá a tu entrenador.'; errEl.style.display = 'block'; return; }
    currentCliente = clientes[0];
    sessionStorage.setItem('cliente_id', currentCliente.id);
    await initApp();
  } catch(e) { errEl.textContent = 'Error de conexión. Intentá de nuevo.'; errEl.style.display = 'block'; }
}

async function doRegister() {
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email = document.getElementById('reg-email').value.trim().toLowerCase();
  const password = document.getElementById('reg-password').value;
  const edad = parseInt(document.getElementById('reg-edad').value) || null;
  const objetivo = document.getElementById('reg-objetivo').value.trim();
  const errEl = document.getElementById('reg-error');
  const successEl = document.getElementById('reg-success');
  errEl.style.display = 'none'; successEl.style.display = 'none';
  if (!nombre) { errEl.textContent = 'Escribí tu nombre'; errEl.style.display = 'block'; return; }
  if (!email) { errEl.textContent = 'Escribí tu email'; errEl.style.display = 'block'; return; }
  if (password.length < 6) { errEl.textContent = 'La contraseña debe tener al menos 6 caracteres'; errEl.style.display = 'block'; return; }
  try {
    const r = await fetch(`${SUPABASE_URL}/auth/v1/signup`, {
      method:'POST', headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
      body: JSON.stringify({email, password})
    });
    const data = await r.json();
    if (!r.ok || data.error) { errEl.textContent = data.error?.message || 'Error al crear la cuenta.'; errEl.style.display = 'block'; return; }
    await dbPost('clientes', {nombre, email, edad, objetivo: objetivo||null, estado:'nuevo', fecha_alta:TODAY});
    successEl.style.display = 'block';
    ['reg-nombre','reg-email','reg-password','reg-edad','reg-objetivo'].forEach(id => document.getElementById(id).value = '');
    setTimeout(() => { switchAuthTab('login'); document.getElementById('login-email').value = email; }, 2000);
  } catch(e) { errEl.textContent = 'Error de conexión. Intentá de nuevo.'; errEl.style.display = 'block'; }
}

function doLogout() {
  sessionStorage.clear();
  currentCliente = null; ejercicios = []; logs = []; sessionState = {};
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app').style.display = 'none';
}

async function initApp() {
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  document.getElementById('header-name').textContent = 'Hola, ' + currentCliente.nombre.split(' ')[0] + ' 👋';
  document.getElementById('header-date').textContent = new Date().toLocaleDateString('es-UY', {weekday:'long', day:'numeric', month:'long'});
  const rutinas = await dbGet('rutinas', `cliente_id=eq.${currentCliente.id}`);
  const rutinaIds = rutinas.map(r => r.id);
  ejercicios = rutinaIds.length ? await dbGet('ejercicios', `rutina_id=in.(${rutinaIds.join(',')})&order=id.asc`) : [];
  logs = await dbGet('logs_entrenamiento', `cliente_id=eq.${currentCliente.id}&order=fecha.desc`);
  buildDayStrip();
  showHome();
}

function buildDayStrip() {
  const exDates = new Set(ejercicios.filter(e => e.fecha_sesion).map(e => e.fecha_sesion));
  const logDates = new Set(logs.map(l => l.fecha));
  const today = new Date();
  let html = '';
  for (let i = -14; i <= 14; i++) {
    const d = new Date(today); d.setDate(today.getDate() + i);
    const ds = d.toISOString().split('T')[0];
    const hasEx = exDates.has(ds);
    const isClosed = hasEx && logDates.has(ds);
    const cls = [ds===TODAY?'today':'', hasEx&&!isClosed?'has-ex':'', isClosed?'is-done':'', ds===selectedDate?'selected':''].filter(Boolean).join(' ');
    html += `<div class="day-btn ${cls}" onclick="selectDay('${ds}')">
      <div class="dn">${DAYS[d.getDay()]}</div>
      <div class="dd">${d.getDate()}</div>
      ${isClosed ? `<div style="font-size:8px;color:white">✓</div>` : ''}
    </div>`;
  }
  document.getElementById('day-strip').innerHTML = html;
  setTimeout(() => {
    const sel = document.querySelector('.day-btn.selected') || document.querySelector('.day-btn.today');
    if (sel) sel.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
  }, 100);
}

function selectDay(ds) {
  selectedDate = ds;
  sessionState = {};
  sessionExs = [];
  completedDayExpanded = false;
  sessionReadOnly = false;
  buildDayStrip();
  showHome();
}

function showHome() {
  document.getElementById('view-home').style.display = 'block';
  document.getElementById('view-session').style.display = 'none';
  document.getElementById('view-summary').style.display = 'none';
  renderHome();
}

function toggleCompletedDay() {
  completedDayExpanded = !completedDayExpanded;
  const content = document.getElementById('completed-day-content');
  const arrow = document.getElementById('completed-day-arrow');
  if (content) content.classList.toggle('open', completedDayExpanded);
  if (arrow) arrow.classList.toggle('open', completedDayExpanded);
}

// ─── WORKOUT BUTTON ──
// Determina el estado del botón según el día
function getWorkoutBtnState(exs, isClosed) {
  if (isClosed) return 'view';
  const marked = countMarked(exs);
  if (marked === 0) return 'start';
  return 'continue';
}

function renderWorkoutBtn(state, firstUnmarkedIdx) {
  const configs = {
    start:    { cls: 'start',    icon: '🏋️', label: 'Iniciar entrenamiento',    idx: 0 },
    continue: { cls: 'continue', icon: '▶️',  label: 'Continuar entrenamiento',  idx: firstUnmarkedIdx },
    view:     { cls: 'view',     icon: '👁',  label: 'Ver entrenamiento',         idx: 0 }
  };
  const c = configs[state];
  return `<button class="workout-btn ${c.cls}" onclick="startWorkout(${c.idx}, '${state}')">
    <span>${c.icon}</span><span>${c.label}</span>
  </button>`;
}

// Arranca la pantalla deslizable
function startWorkout(startIdx, mode) {
  sessionReadOnly = (mode === 'view');
  sessionIdx = startIdx;
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-session').style.display = 'block';
  document.getElementById('view-summary').style.display = 'none';
  renderCard();
  window.scrollTo(0, 0);
}

// ─── HOME ──
function renderHome() {
  const exs = ejercicios.filter(e => e.fecha_sesion === selectedDate);
  document.getElementById('home-loading').style.display = 'none';
  const el = document.getElementById('home-content');
  el.style.display = 'block';

  const isToday = selectedDate === TODAY;
  const dateLabel = isToday ? 'Hoy' : new Date(selectedDate + 'T00:00:00').toLocaleDateString('es-UY', {weekday:'long', day:'numeric', month:'long'});

  if (!exs.length) {
    el.innerHTML = `<div class="empty-day">📅 ${dateLabel}<br><br>No hay ejercicios programados para este día.</div>`;
    return;
  }

  const isClosed = isDayClosed(selectedDate);
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  // ── DÍA COMPLETADO ──
  if (isClosed) {
    const done = exs.filter(e => e.completado === true).length;
    const missed = exs.filter(e => e.completado === false).length;

    const exCards = exs.map((ex, i) => {
      const log = logs.find(l => l.ejercicio_id === ex.id && l.fecha === selectedDate);
      const isExDone = ex.completado === true;
      const letter = letters[i] || (i+1);
      const prescribedTags = [ex.series?`${ex.series} reps`:'', ex.peso?`${ex.peso}`:'', ex.tiempo?`${ex.tiempo}`:''].filter(Boolean);
      let seriesRows = '';
      if (log?.series_realizadas) {
        seriesRows = log.series_realizadas.split(' | ').map(p => `<div class="done-ex-series-row">${p}</div>`).join('');
      } else if (log?.peso_usado || log?.rpe) {
        seriesRows = `<div class="done-ex-series-row">${[log.peso_usado, log.rpe?'RPE '+log.rpe:''].filter(Boolean).join(' · ')}</div>`;
      }
      const comment = ex.devolucion || log?.nota || '';
      return `<div class="done-ex-card ${isExDone?'is-done':'is-missed'}">
        <div class="done-ex-header">
          <div class="done-ex-letter ${isExDone?'':'missed'}">${letter}</div>
          <div class="done-ex-name">${ex.nombre}</div>
          <span class="done-ex-badge ${isExDone?'done':'missed'}">${isExDone?'✓ Hecho':'✕ No hecho'}</span>
        </div>
        ${prescribedTags.length ? `<div class="done-ex-prescribed">${prescribedTags.map(t=>`<span class="prescribed-tag">📋 ${t}</span>`).join('')}${ex.nota?`<div class="prescribed-note">${ex.nota}</div>`:''}</div>` : ex.nota?`<div class="done-ex-prescribed"><div class="prescribed-note">${ex.nota}</div></div>`:''}
        ${ex.link_youtube?`<a class="done-yt-link" href="${ex.link_youtube}" target="_blank">▶ Ver video</a>`:''}
        ${seriesRows||comment?`<div class="done-ex-logged"><div class="done-ex-logged-title">Lo que registraste</div>${seriesRows}${comment?`<div class="done-ex-comment">💬 "${comment}"</div>`:''}</div>`:''}
      </div>`;
    }).join('');

    // Botón "Ver entrenamiento" para día cerrado
    const btnHtml = renderWorkoutBtn('view', 0);

    el.innerHTML = `
      ${btnHtml}
      <div class="completed-day-pill" onclick="toggleCompletedDay()">
        <div class="completed-day-pill-left">
          <div class="completed-day-icon">💪</div>
          <div>
            <div class="completed-day-title">${dateLabel} · ✓ Completado</div>
            <div class="completed-day-sub">${done} hechos · ${missed} no hechos · ${exs.length} ejercicios</div>
          </div>
        </div>
        <div class="completed-day-arrow ${completedDayExpanded?'open':''}" id="completed-day-arrow">▾</div>
      </div>
      <div class="completed-day-content ${completedDayExpanded?'open':''}" id="completed-day-content">
        ${exCards}
      </div>`;
    return;
  }

  // ── DÍA ABIERTO ──
  exs.forEach(ex => {
    if (!sessionState[ex.id]) sessionState[ex.id] = { status: null, comment: '', series: [], attachments: [] };
  });
  sessionExs = exs;

  const marked = countMarked(exs);
  const done = exs.filter(e => sessionState[e.id]?.status === 'done').length;
  const missed = exs.filter(e => sessionState[e.id]?.status === 'missed').length;
  const allMarked = done + missed === exs.length;

  // Primer ejercicio sin marcar (para "Continuar")
  const firstUnmarkedIdx = exs.findIndex(e => !sessionState[e.id]?.status);
  const btnState = getWorkoutBtnState(exs, false);
  const btnHtml = renderWorkoutBtn(btnState, firstUnmarkedIdx >= 0 ? firstUnmarkedIdx : 0);

  const exItems = exs.map((ex, i) => {
    const st = sessionState[ex.id];
    const dotClass = st?.status === 'done' ? 'dot-done' : st?.status === 'missed' ? 'dot-missed' : 'dot-pending';
    const statusText = st?.status === 'done' ? '✓' : st?.status === 'missed' ? '✕' : '›';
    const cardCls = st?.status === 'done' ? 'done' : st?.status === 'missed' ? 'missed' : '';
    const comment = st?.comment || '';
    const log = logs.find(l => l.ejercicio_id === ex.id && l.fecha === selectedDate);
    const loadInfo = log ? [log.series_realizadas, log.peso_usado, log.rpe?'RPE '+log.rpe:''].filter(Boolean).join(' · ') : '';
    return `<div class="ex-preview ${cardCls}" onclick="openExercise(${i})">
      <div class="ex-letter">${letters[i]||(i+1)}</div>
      <div class="ex-preview-info">
        <div class="ex-preview-name">${ex.nombre}</div>
        ${loadInfo?`<div class="ex-preview-tags">${loadInfo}</div>`:ex.series||ex.peso?`<div class="ex-preview-tags">${[ex.series?ex.series+' reps':'',ex.peso,ex.tiempo].filter(Boolean).join(' · ')}</div>`:''}
        ${comment?`<div style="font-size:11px;color:var(--text2);margin-top:2px;font-style:italic">"${comment.slice(0,50)}${comment.length>50?'…':''}"</div>`:''}
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <div class="ex-status-dot ${dotClass}"></div>
        <span style="font-size:12px;color:var(--text2)">${statusText}</span>
      </div>
    </div>`;
  }).join('');

  el.innerHTML = `
    ${btnHtml}
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:0.75rem">
      <span style="font-size:15px;font-weight:600;color:var(--text);text-transform:capitalize">${dateLabel}</span>
      <span style="font-size:12px;color:var(--text2)">${done}/${exs.length} hechos</span>
    </div>
    ${exItems}
    ${allMarked?`<button style="width:100%;padding:0.9rem;border-radius:14px;border:none;background:var(--orange);color:white;font-size:16px;font-weight:600;cursor:pointer;margin-top:0.75rem" onclick="showSummaryFromHome()">📋 Ver resumen</button>`:''}
    <button class="btn-save-session" style="margin-top:0.5rem" onclick="saveFinalSession()">💾 Guardar sesión</button>`;
}

// ─── SESSION ──
function openExercise(idx) {
  sessionReadOnly = false;
  sessionIdx = idx;
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-session').style.display = 'block';
  renderCard();
  window.scrollTo(0, 0);
}

function showSummaryFromHome() {
  document.getElementById('view-home').style.display = 'none';
  showSummary();
}

function renderCard() {
  const ex = sessionExs[sessionIdx];
  if (!ex) return;
  const state = sessionState[ex.id] || { status: null, comment: '', series: [], attachments: [] };
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const isLast = sessionIdx === sessionExs.length - 1;
  const ro = sessionReadOnly; // modo lectura

  // Label del header según modo
  const modeLabel = ro ? 'Ver entrenamiento' : 'Entrenamiento';
  document.getElementById('session-label').textContent = modeLabel;
  document.getElementById('session-counter').textContent = `${sessionIdx + 1}/${sessionExs.length}`;
  document.getElementById('progress-dots').innerHTML = sessionExs.map((e, i) => {
    const st = sessionState[e.id];
    let cls = i === sessionIdx ? 'current' : st?.status === 'done' ? 'done' : st?.status === 'missed' ? 'missed' : '';
    return `<div class="prog-dot ${cls}"></div>`;
  }).join('');

  const prevLog = logs.find(l => l.ejercicio_id === ex.id && l.fecha < selectedDate);
  const numSeries = parseInt(ex.series) || 3;

  // En modo lectura para día cerrado, mostrar lo que registró el alumno
  const closedLog = ro ? logs.find(l => l.ejercicio_id === ex.id && l.fecha === selectedDate) : null;

  let seriesHtml = '';
  if (ro && closedLog?.series_realizadas) {
    // Modo lectura: mostrar lo que registró
    const parts = closedLog.series_realizadas.split(' | ');
    seriesHtml = `<div style="background:#f2f2f7;border-radius:10px;padding:0.75rem 1rem;margin-bottom:1rem">
      <div style="font-size:10px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:0.05em;margin-bottom:6px">Lo que registraste</div>
      ${parts.map(p => `<div style="font-size:13px;color:var(--text);padding:3px 0;border-bottom:0.5px solid var(--border)">${p}</div>`).join('')}
      ${closedLog.nota ? `<div style="font-size:12px;color:var(--text2);font-style:italic;margin-top:6px;padding-top:6px;border-top:0.5px solid var(--border)">💬 "${closedLog.nota}"</div>` : ''}
    </div>`;
  } else if (!ro) {
    // Modo edición: inputs
    for (let s = 0; s < numSeries; s++) {
      const sv = state.series[s] || {};
      seriesHtml += `<div class="series-row">
        <div class="series-num">S${s+1}</div>
        <div class="series-inputs">
          <input class="series-input" id="s-peso-${s}" placeholder="kg" value="${sv.peso||''}" />
          <input class="series-input" id="s-reps-${s}" placeholder="reps" value="${sv.reps||''}" />
          <input class="series-input" id="s-rpe-${s}" placeholder="RPE" value="${sv.rpe||''}" />
        </div>
      </div>`;
    }
    seriesHtml = `<div class="series-list">${seriesHtml}</div>`;
  }

  const exLogs = logs.filter(l => l.ejercicio_id === ex.id && l.fecha < selectedDate).slice(0, 5);
  const histHtml = exLogs.map(l => {
    const d = new Date(l.fecha+'T00:00:00').toLocaleDateString('es-UY',{weekday:'short',day:'numeric',month:'short'});
    const load = [l.series_realizadas, l.peso_usado, l.rpe?'RPE '+l.rpe:''].filter(Boolean).join(' · ');
    return `<div class="history-entry"><div class="history-date">📅 ${d}</div>${load?`<div class="history-load">${load}</div>`:''}</div>`;
  }).join('');

  let attachHtml = '';
  if (state.attachments?.length) {
    attachHtml = `<div class="attach-preview">${state.attachments.map(a => `<img class="attach-thumb" src="${a}" />`).join('')}</div>`;
  }

  const commentOpen = state.status ? 'open' : '';
  const commentColor = state.status === 'done' ? 'green' : state.status === 'missed' ? 'red' : '';

  // Bloque de lo que programó el profe
  const prescribedItems = [
    ex.series ? `${ex.series} series` : '',
    ex.reps ? `${ex.reps} reps` : ex.series ? '' : '',
    ex.peso ? `${ex.peso}` : '',
    ex.tiempo ? `${ex.tiempo}` : ''
  ].filter(Boolean);
  // Reconstruir desde campo series que puede ser "3x12" etc
  const prescribedText = [ex.series, ex.peso, ex.tiempo].filter(Boolean).join(' · ');

  const prescribedBlock = (prescribedText || ex.nota) ? `
    <div class="ex-prescribed-block">
      <div class="ex-prescribed-block-title">📋 Lo que te toca hoy</div>
      ${prescribedText ? `<div class="ex-prescribed-row">${prescribedText}</div>` : ''}
      ${ex.nota ? `<div class="ex-prescribed-row" style="margin-top:4px;font-style:italic">${ex.nota}</div>` : ''}
    </div>` : '';

  // Botones de navegación según modo
  let navBtns = '';
  if (ro) {
    // Solo navegación sin acciones
    navBtns = `<div class="session-nav-btns">
      ${sessionIdx > 0 ? `<button class="btn-prev" onclick="navSession(-1)">← Anterior</button>` : '<div></div>'}
      ${isLast ? `<button class="btn-next" onclick="exitSession()">✓ Cerrar</button>` : `<button class="btn-next" onclick="navSession(1)">Siguiente →</button>`}
    </div>`;
  } else {
    navBtns = `<div class="session-nav-btns">
      ${sessionIdx > 0 ? `<button class="btn-prev" onclick="navSession(-1)">← Anterior</button>` : '<div></div>'}
      ${isLast ? `<button class="btn-finish" onclick="saveCardAndSummary()">Finalizar 🏁</button>` : `<button class="btn-next" onclick="saveCardAndNext()">Siguiente →</button>`}
    </div>`;
  }

  document.getElementById('session-body').innerHTML = `
    <div class="ex-card">
      <div class="ex-card-header">
        <div class="ex-card-letter">${letters[sessionIdx]||sessionIdx+1}</div>
        <div>
          <div class="ex-card-name">${ex.nombre}</div>
          <div class="ex-card-links">
            ${exLogs.length ? `<span class="ex-card-link" onclick="toggleHistory('hist-${ex.id}')">🕐 Historial</span>` : ''}
            ${ex.link_youtube ? `<a class="ex-card-link yt" href="${ex.link_youtube}" target="_blank">▶ Video</a>` : ''}
          </div>
        </div>
      </div>
      ${prescribedBlock}
      ${prevLog&&!ro ? `<div style="font-size:11px;color:var(--green-dark);background:var(--green-light);padding:6px 10px;border-radius:8px;margin-bottom:1rem">📊 Última vez (${new Date(prevLog.fecha+'T00:00:00').toLocaleDateString('es-UY',{day:'numeric',month:'short'})}): ${[prevLog.series_realizadas,prevLog.peso_usado,prevLog.rpe?'RPE '+prevLog.rpe:''].filter(Boolean).join(' · ')}</div>` : ''}
      ${seriesHtml}
      ${histHtml ? `<button class="history-btn" onclick="toggleHistory('hist-${ex.id}')">🕐 Ver historial</button><div class="history-content" id="hist-${ex.id}">${histHtml}</div>` : ''}
      ${!ro ? `<label class="attach-btn" onclick="openFileInput(${ex.id})">📎 Adjuntar foto o video</label>${attachHtml}
      <div class="action-btns">
        <button class="btn-missed ${state.status==='missed'?'active':''}" onclick="setStatus('missed')">✕ No completado</button>
        <button class="btn-completed ${state.status==='done'?'active':''}" onclick="setStatus('done')">✓ Completado</button>
      </div>
      <div class="comment-wrap ${commentOpen} ${commentColor}" id="comment-wrap">
        <textarea id="ex-comment" placeholder="${state.status==='done'?'¿Cómo te fue?':'¿Qué pasó?'}">${state.comment||''}</textarea>
      </div>` : ''}
    </div>
    ${navBtns}`;
}

function toggleHistory(id) { const el = document.getElementById(id); if (el) el.classList.toggle('open'); }

function setStatus(status) {
  const ex = sessionExs[sessionIdx];
  sessionState[ex.id].status = status;
  const wrap = document.getElementById('comment-wrap');
  wrap.classList.add('open');
  wrap.classList.remove('green', 'red');
  wrap.classList.add(status === 'done' ? 'green' : 'red');
  document.querySelectorAll('.btn-missed,.btn-completed').forEach(b => b.classList.remove('active'));
  document.querySelector(status === 'done' ? '.btn-completed' : '.btn-missed').classList.add('active');
}

function saveCurrentCard() {
  if (sessionReadOnly) return;
  const ex = sessionExs[sessionIdx];
  if (!ex) return;
  const state = sessionState[ex.id];
  const numSeries = parseInt(ex.series) || 3;
  state.series = [];
  for (let s = 0; s < numSeries; s++) {
    state.series.push({
      peso: document.getElementById(`s-peso-${s}`)?.value.trim() || '',
      reps: document.getElementById(`s-reps-${s}`)?.value.trim() || '',
      rpe: document.getElementById(`s-rpe-${s}`)?.value.trim() || ''
    });
  }
  state.comment = document.getElementById('ex-comment')?.value.trim() || '';
}

function saveCardAndNext() { saveCurrentCard(); sessionIdx++; renderCard(); window.scrollTo(0,0); }
function saveCardAndSummary() { saveCurrentCard(); showSummary(); }
function navSession(dir) {
  if (!sessionReadOnly) saveCurrentCard();
  sessionIdx = Math.max(0, Math.min(sessionExs.length - 1, sessionIdx + dir));
  renderCard(); window.scrollTo(0,0);
}
function exitSession() {
  if (!sessionReadOnly) saveCurrentCard();
  document.getElementById('view-session').style.display = 'none';
  showHome();
}

function openFileInput(exId) { currentExIdForFile = exId; document.getElementById('file-input').click(); }
function handleFileUpload(event) {
  const files = event.target.files;
  if (!files.length || !currentExIdForFile) return;
  const state = sessionState[currentExIdForFile];
  if (!state.attachments) state.attachments = [];
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => { state.attachments.push(e.target.result); if (sessionExs[sessionIdx]?.id === currentExIdForFile) renderCard(); };
    reader.readAsDataURL(file);
  });
  event.target.value = '';
}

// ─── SUMMARY ──
function showSummary() {
  document.getElementById('view-session').style.display = 'none';
  document.getElementById('view-summary').style.display = 'block';
  const done = sessionExs.filter(e => sessionState[e.id]?.status === 'done').length;
  const missed = sessionExs.filter(e => sessionState[e.id]?.status === 'missed').length;
  const pending = sessionExs.length - done - missed;
  const letters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  const items = sessionExs.map((ex, i) => {
    const st = sessionState[ex.id];
    const status = st?.status;
    const statusLabel = status === 'done' ? 'Completado' : status === 'missed' ? 'No completado' : 'Pendiente';
    const statusCls = status === 'done' ? 'done' : status === 'missed' ? 'missed' : '';
    const seriesSummary = st?.series?.filter(s => s.peso || s.reps).map((s, si) =>
      `S${si+1}: ${[s.peso?s.peso+'kg':'', s.reps?s.reps+' reps':'', s.rpe?'RPE '+s.rpe:''].filter(Boolean).join(' · ')}`
    ).join('<br>') || '';
    return `<div class="summary-item">
      <div class="summary-item-name">
        <span style="background:var(--green-light);color:var(--green-dark);width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px">${letters[i]}</span>
        ${ex.nombre}
        ${statusCls?`<span class="summary-status ${statusCls}">${statusLabel}</span>`:''}
      </div>
      ${seriesSummary?`<div style="font-size:12px;color:var(--text2);margin-bottom:4px;line-height:1.6">${seriesSummary}</div>`:''}
      ${st?.comment?`<div class="summary-comment">"${st.comment}"</div>`:''}
    </div>`;
  }).join('');
  document.getElementById('summary-content').innerHTML = `
    <div class="summary-stats">
      <div class="stat-card"><div class="stat-num green">${done}</div><div class="stat-label">Completados</div></div>
      <div class="stat-card"><div class="stat-num red">${missed}</div><div class="stat-label">No completados</div></div>
    </div>
    ${pending > 0 ? `<div style="font-size:13px;color:var(--orange);margin-bottom:1rem;text-align:center">⚠️ ${pending} ejercicio${pending>1?'s':''} sin marcar</div>` : ''}
    ${items}`;
}

async function saveFinalSession() {
  if (document.getElementById('view-session').style.display !== 'none') saveCurrentCard();
  document.getElementById('view-home').style.display = 'none';
  document.getElementById('view-summary').style.display = 'block';
  const btn = document.getElementById('btn-save-session');
  btn.disabled = true; btn.textContent = 'Guardando…';
  try {
    for (const ex of sessionExs) {
      const st = sessionState[ex.id];
      if (!st) continue;
      const isCompleted = st.status === 'done';
      const isNotCompleted = st.status === 'missed';
      const seriesSummary = st.series?.filter(s => s.peso || s.reps).map((s, i) =>
        `S${i+1}: ${[s.peso?s.peso+'kg':'', s.reps?s.reps+' reps':'', s.rpe?'RPE '+s.rpe:''].filter(Boolean).join(' ')}`
      ).join(' | ') || null;

      if (seriesSummary || st.comment) {
        const existing = logs.find(l => l.ejercicio_id === ex.id && l.fecha === selectedDate);
        if (existing) {
          await dbPatch('logs_entrenamiento', existing.id, {series_realizadas: seriesSummary, peso_usado: st.series?.[0]?.peso||null, rpe: st.series?.[0]?.rpe||null, nota: st.comment||null});
        } else {
          const newLog = await dbPost('logs_entrenamiento', {cliente_id: currentCliente.id, ejercicio_id: ex.id, fecha: selectedDate, series_realizadas: seriesSummary, peso_usado: st.series?.[0]?.peso||null, rpe: st.series?.[0]?.rpe||null, nota: st.comment||null});
          logs.unshift(newLog[0]);
        }
      } else if (isCompleted || isNotCompleted) {
        const existing = logs.find(l => l.ejercicio_id === ex.id && l.fecha === selectedDate);
        if (!existing) {
          const newLog = await dbPost('logs_entrenamiento', {cliente_id: currentCliente.id, ejercicio_id: ex.id, fecha: selectedDate, series_realizadas: null, peso_usado: null, rpe: null, nota: st.comment||null});
          logs.unshift(newLog[0]);
        }
      }
      await dbPatch('ejercicios', ex.id, {completado: isCompleted, devolucion: st.comment||null});
      const localEx = ejercicios.find(e => e.id === ex.id);
      if (localEx) { localEx.completado = isCompleted; localEx.devolucion = st.comment||null; }
    }
    showToast('Sesión guardada ✓');
    btn.textContent = '✓ Sesión guardada';
    logs = await dbGet('logs_entrenamiento', `cliente_id=eq.${currentCliente.id}&order=fecha.desc`);
    buildDayStrip();
    setTimeout(() => showHome(), 1500);
  } catch(e) {
    console.error(e);
    btn.disabled = false; btn.textContent = '💾 Guardar sesión del día';
    showToast('Error al guardar', true);
  }
}

function showToast(msg, err=false) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('error', err);
  t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2500);
}

window.onload = async () => {
  const cid = sessionStorage.getItem('cliente_id');
  if (cid) {
    try {
      const clientes = await dbGet('clientes', `id=eq.${cid}&limit=1`);
      if (clientes.length) { currentCliente = clientes[0]; await initApp(); return; }
    } catch(e) {}
  }
  document.getElementById('login-screen').style.display = 'flex';
};
</script>
